; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

;upload_protocol = espota       ; через OTA: pio run -t upload | файловая система: pio run -t uploadfs ИЛИ указать порт IP устройства и выбрать стандартную загрузку
;upload_protocol = esptool      ; через USB
;upload_port = 192.168.1.210    ; IP-адрес вашего ESP8266
;upload_flags = 
;  --port=8266                 ; Порт для OTA (по умолчанию 8266)
;  --auth=your_password        ; Пароль для OTA (опционально)

lib_deps =
    ArduinoOTA
    links2004/WebSockets @ ^2.3.6
    https://github.com/me-no-dev/ESPAsyncWebServer.git
	https://github.com/me-no-dev/ESPAsyncTCP.git
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_LITTLEFS

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<domain/SensorData.cpp>
    +<application/SensorValueValidator.cpp>
    +<application/SensorUpdateService.cpp>
    +<application/WsMessageHandler.cpp>
    +<application/WSDataTransformer.cpp>
    +<application/events/EventNotifier.cpp>
    +<application/network/WiFiConnectionManager.cpp>
    +<application/reporting/DailyTemperatureReporter.cpp>
